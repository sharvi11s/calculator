<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="calculator">
        <input id="display" readonly>
        <div id="keys">
            <button onclick="appendToDisplay('π')" class="operator-btn-4">π</button>
            <button onclick="appendToDisplay('!')" class="operator-btn-4">!</button>
            <button onclick="appendToDisplay('e')" class="operator-btn-4">e</button>
            <button onclick="appendToDisplay('log')" class="operator-btn-4">log</button>
            <button onclick="appendToDisplay('ln')" class="operator-btn-4   ">ln</button>
            <button onclick="appendToDisplay('sin')" class="operator-btn-3"> sin </button>
            <button onclick="appendToDisplay('cos')" class="operator-btn-3"> cos </button>
            <button onclick="appendToDisplay('tan')" class="operator-btn-3"> tan </button>
            <button onclick="inverseSin()" class="operator-btn-3">sin⁻¹</button>
            <button onclick="inverseCos()" class="operator-btn-3">cos⁻¹</button>
            <button onclick="inverseTan()" class="operator-btn-3">tan⁻¹</button>
            <button id="angleModeBtn" onclick="toggleAngleMode()" class="operator-btn-3">DEG</button>
            <button onclick="appendToDisplay('√')" class="operator-btn-2"> √x </button>
            <button onclick="cubeRoot()" class="operator-btn-2">∛x</button>
            <button onclick="power()" class="operator-btn-2"> xʸ </button>
            <button onclick="square()" class="operator-btn-2"> x² </button>
            <button onclick="cube()" class="operator-btn-2"> x³ </button>
            <button onclick="convertFractionDecimal()" class="operator-btn-5">F↔D</button>
            <button onclick="reciprocal()" class="operator-btn-5">1/x</button>
            <button onclick="absoluteValue()" class="operator-btn-5">|x|</button>
            <button onclick="deleteLast()" class="operator">DEL</button>
            <button onclick="clearDisplay()" class="operator"> AC </button>
            <button onclick="appendToDisplay('(')" class="operator-btn"> ( </button>
            <button onclick="appendToDisplay(')')" class="operator-btn"> ) </button>
            <button onclick="appendToDisplay('/')" class="operator-btn"> / </button>
            <button onclick="appendToDisplay('7')"> 7 </button>
            <button onclick="appendToDisplay('8')"> 8 </button>
            <button onclick="appendToDisplay('9')"> 9 </button>
            <button onclick="appendToDisplay('*')" class="operator-btn"> x </button>
            <button onclick="appendToDisplay('4')"> 4 </button>
            <button onclick="appendToDisplay('5')"> 5 </button>
            <button onclick="appendToDisplay('6')"> 6 </button>
            <button onclick="appendToDisplay('-')" class="operator-btn"> - </button>
            <button onclick="appendToDisplay('1')"> 1 </button>
            <button onclick="appendToDisplay('2')"> 2 </button>
            <button onclick="appendToDisplay('3')"> 3 </button>
            <button onclick="appendToDisplay('+')" class="operator-btn"> + </button>
            <button onclick="appendToDisplay('0')"> 0 </button>
            <button onclick="appendToDisplay('.')"> . </button>
            <button onclick="calculate()" class="operator"> = </button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
